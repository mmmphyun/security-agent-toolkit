name: Daily DevLog Draft Generator

on:
  push:
    paths:
      - 'agent_core/**'
      - 'network_zt/**'
      - 'projects/**'
    branches-ignore:
      - 'automation/**'
  schedule:
    # 매일 한국 시간 18:00 (UTC 09:00) 보조 정기 점검
    - cron: '0 9 * * *'
  workflow_dispatch: # GitHub 웹 UI에서 수동 실행 가능

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Generate draft and validate with harness
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python pipeline/generate_draft.py --auto

      - name: Check for new draft files
        id: git-check
        run: |
          git status --porcelain docs/posts/
          if [ -n "$(git status --porcelain docs/posts/)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request for new draft
        if: steps.git-check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(docs): 새 실습 일차 블로그 초안 자동 생성 및 하네스 검증 통과"
          branch: "automation/daily-devlog-draft"
          delete-branch: true
          add-paths: docs/posts/
          title: "feat(docs): 기술 블로그 새 초안 검토 요청"
          body: |
            ## 일일 기술 블로그 초안 자동 생성 완료

            Gemini API를 통해 당일 실습 코드와 주석을 인제스트하고, `pipeline/harness.py` 검증을 통과한 초안이 생성되었습니다.

            ### 검토 및 배포 방법
            1. 아래 변경된 마크다운 파일의 내용과 Mermaid 다이어그램을 확인하십시오.
            2. 수정할 내용이 있다면 웹/모바일에서 직접 편집 커밋을 추가하십시오.
            3. 최종 확인 후 **Merge pull request** 버튼을 누르면 GitHub Pages로 즉시 자동 배포됩니다.
