[project]
name = "security-agent-toolkit"
version = "0.1.0"
description = "SKT ALEPH 보안 자동화 실습 및 기술 블로그 자동화 툴체인"
authors = [{ name = "mmmphyun" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "schedule>=1.2.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.5.0",
    "google-generativeai>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
