<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>로그인 | mini-watch</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>로그인</h1>
    <p id="message" role="alert"></p>
    <div>
        <p>
            <label for="username">아이디</label>
            <input id="username" type="text">
        </p>
        <p>
            <label for="password">비밀번호</label>
            <input id="password" type="password">
        </p>
        <button id="login-btn" type="button">로그인</button>
    </div>
    <p><a href="/">게시글 목록으로</a></p>

    <script>
        document.getElementById('login-btn').addEventListener('click', async () => {
            const messageEl = document.getElementById('message');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    messageEl.className = '';
                    messageEl.textContent = `${data.user.username}님, ${data.message}`;
                } else {
                    messageEl.className = 'error';
                    messageEl.textContent = data.error || '로그인에 실패했습니다.';
                }
            } catch (err) {
                messageEl.className = 'error';
                messageEl.textContent = '서버와 통신하지 못했습니다.';
            }
        });
    </script>
</body>
</html>
